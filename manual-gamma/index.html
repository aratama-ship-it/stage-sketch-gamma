<!DOCTYPE html>

<title>使いかたの手引き — 舞台スケッチ γ</title>
<style>
/* ============================================================
   舞台スケッチγ 使いかたの手引き — 器（本文は content/*.js が持つ）
   値は design/TOKEN_SHEET.md が正。ここに無い数値をコンポーネントへ直書きしない。
   コンセプト: 「暗い机の上に置いた、引ける台本」。
   ============================================================ */
:root {
  --desk: #191512; --desk-2: #282119;
  --paper: #efe7d6; --paper-2: #e7dcc5; --paper-line: #d8c9ab;
  --ink: #2b2620; --ink-soft: #6a604e;
  --rust: #a84b26; --rust-deep: #8f3e1e; --brass: #9c823f; --gold: #d3ac59;
  --desk-text: #b6a995; --desk-line: rgba(240,231,214,.14); --rust-desk: #d0714a;
  --ok: #1f5c3a; --warn: #7a3a2a;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", serif;
  --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --fs-h1: 34px; --fs-h2: 22px; --fs-h3: 17px; --fs-body: 15px; --fs-small: 13.5px; --fs-caption: 12.5px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
  --radius-s: 2px; --radius-m: 4px;
  --shadow-paper: 0 1px 0 rgba(0,0,0,.5), 0 12px 40px rgba(0,0,0,.45);
  --dur-fast: 160ms; --dur-slow: 240ms; --ease: cubic-bezier(.2,.7,.2,1);
  --side-w: 272px; --paper-w: 760px; --finder-h: 48px;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-fast: 0ms; --dur-slow: 0ms; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--finder-h) + 40px); }
body { background: var(--desk); color: var(--ink); font-family: var(--sans); font-size: var(--fs-body); line-height: 1.9; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 120% 90% at 50% 0%, rgba(240,231,214,.05), transparent 60%); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--paper); color: var(--ink); padding: 6px 12px; z-index: 50; }
.skip:focus { left: 8px; }
a { color: var(--rust-deep); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- 全体の2列 ---------- */
.book { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }

/* ---------- 左: 目次（机の上） ---------- */
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-5) var(--sp-4) var(--sp-6); border-right: 1px solid var(--desk-line); color: var(--desk-text); font-size: var(--fs-caption); line-height: 1.6; scrollbar-width: thin; }
.side-head { margin-bottom: var(--sp-4); }
.side .kicker { display: block; font-size: 11px; letter-spacing: .28em; color: var(--rust-desk); margin-bottom: 6px; }
.side-title { display: block; font-family: var(--serif); font-size: 18px; letter-spacing: .06em; color: var(--paper); text-decoration: none; font-weight: 600; }
.side-title:hover { color: var(--gold); }
.side-note { color: var(--desk-text); margin-top: 6px; font-size: 11.5px; }
.toc-tools { display: flex; gap: var(--sp-2); margin: var(--sp-3) 0 var(--sp-2); }
.toc-tools button { appearance: none; background: none; border: 1px solid var(--desk-line); color: var(--desk-text); font: 11px/1.4 var(--sans); padding: 3px 8px; cursor: pointer; border-radius: var(--radius-s); min-height: 28px; }
.toc-tools button:hover { color: var(--paper); border-color: var(--brass); }
.toc { list-style: none; }
.toc > li { border-top: 1px solid var(--desk-line); }

.toc-ch { display: grid; grid-template-columns: 1fr 28px; align-items: center; }
.toc-ch > a { display: block; padding: 8px 0 8px 0; color: var(--desk-text); text-decoration: none; font-family: var(--serif); font-size: 13px; letter-spacing: .04em; }
.toc-ch > a .no { color: var(--brass); font-family: var(--sans); font-size: 11px; margin-right: 6px; letter-spacing: .1em; }
.toc-ch > a:hover, .toc > li.is-current > .toc-ch > a { color: var(--paper); }
.toc-ch > button { appearance: none; background: none; border: none; color: var(--desk-text); cursor: pointer; width: 28px; height: 28px; font-size: 11px; border-radius: var(--radius-s); }
.toc-ch > button:hover { color: var(--paper); background: var(--desk-2); }
.toc-ch > button::before { content: "▸"; display: inline-block; transition: transform var(--dur-fast) var(--ease); }
.toc > li.is-open > .toc-ch > button::before { transform: rotate(90deg); }
.toc-secs { list-style: none; display: none; padding: 0 0 8px 0; }
.toc > li.is-open > .toc-secs { display: block; }
.toc-secs a { display: block; padding: 4px 8px 4px 18px; color: var(--desk-text); text-decoration: none; border-left: 2px solid transparent; font-size: 12.5px; line-height: 1.5; }
.toc-secs a:hover { color: var(--paper); background: var(--desk-2); }
.toc-secs a.is-active { color: var(--gold); border-left-color: var(--gold); }
.toc-secs a.hidden-by-find { display: none; }
.side-foot { margin-top: var(--sp-5); padding-top: var(--sp-3); border-top: 1px solid var(--desk-line); font-size: 11.5px; display: grid; gap: 6px; }
.side-foot a { color: var(--paper); }
.side-foot a:hover { color: var(--gold); }

/* ---------- 右: 紙 ---------- */
.stage { padding: var(--sp-7) var(--sp-4) 120px; min-width: 0; }
.paper { background: var(--paper); max-width: var(--paper-w); margin: 0 auto; padding: var(--sp-8) 56px var(--sp-8); border: 1px solid var(--paper-line); box-shadow: var(--shadow-paper); position: relative; }
.paper::before { content: ""; position: absolute; top: 0; bottom: 0; left: 10px; width: 1px; background: var(--paper-line); }

.head { border-bottom: 2px solid var(--ink); padding-bottom: var(--sp-5); }
.head .kicker { font-size: 12px; letter-spacing: .3em; color: var(--rust-deep); margin-bottom: var(--sp-3); display: flex; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }
.head .kicker .ver { letter-spacing: .1em; color: var(--ink-soft); }
.head h1 { font-family: var(--serif); font-weight: 600; font-size: var(--fs-h1); letter-spacing: .06em; line-height: 1.4; }
.head .sub { margin-top: var(--sp-3); color: var(--ink-soft); font-size: var(--fs-small); line-height: 1.7; }
.head .sub a { color: var(--rust-deep); }
.version-note { margin-top: var(--sp-3); padding: 8px 12px; border-left: 3px solid var(--rust); background: var(--paper-2); font-size: var(--fs-small); line-height: 1.7; }
#lang-switch { margin-left: auto; border-color: var(--brass); color: var(--paper); }
html[lang="en"] body { line-height: 1.75; }
html[lang="en"] .toc-ch > a, html[lang="en"] .chapter > h2, html[lang="en"] .sec h3 { letter-spacing: 0; }

/* ---------- 検索（紙の上端に貼り付く） ---------- */
.finder { position: sticky; top: 0; z-index: 20; background: var(--paper); padding: var(--sp-3) 0 var(--sp-2); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-bottom: 1px solid var(--paper-line); }
.finder .row { display: flex; align-items: center; gap: var(--sp-2); position: relative; }
.finder .row::before { content: "⌕"; font-size: 18px; color: var(--ink-soft); line-height: 1; }
.finder input { flex: 1; font: 16px/1.5 var(--sans); color: var(--ink); background: transparent; border: none; border-bottom: 1px solid var(--ink-soft); padding: 6px 2px; border-radius: 0; min-height: 36px; }
.finder input:focus { outline: none; border-bottom-color: var(--rust); }
.finder input::placeholder { color: var(--ink-soft); opacity: .75; }
.finder input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.finder .clear { appearance: none; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-soft); font-size: 12px; padding: 4px 6px; visibility: hidden; min-height: 28px; border-radius: var(--radius-s); }
.finder .clear.show { visibility: visible; }
.finder .clear:hover { border-color: var(--paper-line); color: var(--rust-deep); }
.finder kbd.hint { font-size: 11px; color: var(--ink-soft); border: 1px solid var(--paper-line); padding: 1px 6px; border-radius: var(--radius-s); background: var(--paper-2); }
.finder .meta { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); margin-top: 6px; font-size: var(--fs-caption); color: var(--ink-soft); min-height: 1.6em; flex-wrap: wrap; }
.finder .meta label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.finder .meta input { accent-color: var(--rust-deep); width: 18px; height: 18px; }
.finder .meta label { min-height: 32px; padding-right: 4px; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 2px); background: var(--desk); color: var(--desk-text); border: 1px solid var(--desk-line); box-shadow: var(--shadow-paper); max-height: min(60vh, 520px); overflow-y: auto; display: none; z-index: 30; }
.results.show { display: block; }
.results ol { list-style: none; }
.results li { border-bottom: 1px solid var(--desk-line); }
.results li:last-child { border-bottom: none; }
.results a { display: block; padding: 10px 14px; text-decoration: none; color: var(--desk-text); }
.results a:hover, .results li.is-cursor a { background: var(--desk-2); }
.results .path { font-size: 11px; letter-spacing: .06em; color: var(--brass); }
.results .ttl { display: block; color: var(--paper); font-family: var(--serif); font-size: 14px; margin: 2px 0; }
.results .snip { font-size: 12px; line-height: 1.6; color: var(--desk-text); }
.results mark { background: none; color: var(--gold); font-weight: 600; }
.results .more { padding: 8px 14px; font-size: 11.5px; color: var(--desk-text); }

/* ---------- 本文 ---------- */
.body { padding-top: var(--sp-4); }
.lead { margin-top: var(--sp-5); padding: var(--sp-4) var(--sp-5); background: var(--paper-2); border-left: 3px solid var(--rust); font-size: var(--fs-small); line-height: 1.8; }
.chapter { padding-top: var(--sp-6); }
.chapter + .chapter { border-top: 1px solid var(--paper-line); margin-top: var(--sp-7); }
.chapter > h2 { font-family: var(--serif); font-weight: 600; font-size: var(--fs-h2); letter-spacing: .08em; line-height: 1.5; margin-bottom: var(--sp-2); }
.chapter > h2 .cno { display: block; font-size: 11.5px; letter-spacing: .3em; color: var(--rust-deep); margin-bottom: 8px; font-family: var(--sans); font-weight: 400; }
.chapter > .ch-lead { color: var(--ink-soft); font-size: var(--fs-small); line-height: 1.8; margin-bottom: var(--sp-2); }
.sec { margin-top: var(--sp-6); scroll-margin-top: calc(var(--finder-h) + 40px); }
.sec.is-flash { animation: flash var(--dur-slow) var(--ease) 2 alternate; }
@keyframes flash { from { box-shadow: inset 4px 0 0 var(--rust); } to { box-shadow: inset 4px 0 0 transparent; } }
.sec h3 { font-family: var(--serif); font-weight: 600; font-size: var(--fs-h3); letter-spacing: .05em; line-height: 1.6; margin-bottom: var(--sp-2); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sec h3 .sno { font-family: var(--sans); font-size: 11.5px; color: var(--rust-deep); letter-spacing: .1em; font-weight: 400; }
.sec h3 .anchor { appearance: none; background: none; border: none; color: var(--ink-soft); cursor: pointer; font: 14px/1 var(--sans); padding: 2px 6px; margin-left: auto; border-radius: var(--radius-s); min-width: 32px; min-height: 32px; }
.sec h3 .anchor:hover, .sec h3 .anchor:focus-visible { color: var(--rust-deep); background: var(--paper-2); }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--sp-3); }
.tag { font-family: var(--sans); font-size: 11px; letter-spacing: .08em; color: var(--rust-deep); border: 1px solid var(--rust-deep); padding: 1px 7px; border-radius: var(--radius-s); white-space: nowrap; }
.tag.st-verified { color: var(--ok); border-color: var(--ok); }
.tag.st-sourced { color: var(--ink-soft); border-color: var(--ink-soft); }
.tag.st-unverified { color: var(--warn); border-color: var(--warn); border-style: dashed; }
.sec p + p, .sec p + ul, .sec p + ol, .sec ul + p, .sec ol + p, .sec p + table, .sec table + p, .sec p + figure, .sec figure + p, .sec figure + figure, .sec ol + figure, .sec ul + figure, .sec figure + ol, .sec figure + ul, .sec p + dl, .sec dl + p, .sec p + .note, .sec .note + p, .sec ul + .note, .sec ol + .note, .sec .note + ul, .sec figure + .note, .sec .note + figure, .sec table + figure, .sec figure + table, .sec ul + ul, .sec ol + ol, .sec ul + ol, .sec ol + ul, .sec table + ul, .sec ul + table, .sec table + ol, .sec ol + table, .sec dl + figure, .sec figure + dl, .sec h4 + * { margin-top: var(--sp-3); }
.sec h4 { font-family: var(--sans); font-weight: 600; font-size: var(--fs-body); margin-top: var(--sp-4); color: var(--ink); }
.sec ul, .sec ol { padding-left: 1.5em; }
.sec li + li { margin-top: 6px; }
.sec ol.steps { counter-reset: st; list-style: none; padding-left: 0; }
.sec ol.steps > li { position: relative; padding-left: 2.2em; counter-increment: st; }
.sec ol.steps > li::before { content: counter(st); position: absolute; left: 0; top: .35em; width: 1.6em; height: 1.6em; border: 1px solid var(--rust-deep); color: var(--rust-deep); font-size: 11.5px; line-height: 1.6em; text-align: center; font-family: var(--sans); border-radius: 50%; }
.sec a { color: var(--rust-deep); text-decoration: none; border-bottom: 1px solid rgba(143,62,30,.4); overflow-wrap: anywhere; }
.sec a:hover { border-bottom-color: var(--rust-deep); }
.sec strong { font-weight: 600; color: var(--rust-deep); }
.sec .ui { white-space: nowrap; }
.sec .gloss { color: var(--ink-soft); font-size: .92em; }
.sec kbd { font: 12.5px/1.4 var(--sans); background: var(--paper-2); border: 1px solid var(--paper-line); border-bottom-width: 2px; border-radius: var(--radius-s); padding: 1px 6px; color: var(--ink); white-space: nowrap; }
.sec code { font: 13px/1.5 var(--sans); background: var(--paper-2); padding: 1px 5px; border-radius: var(--radius-s); overflow-wrap: anywhere; word-break: break-all; }
.sec mark { background: rgba(211,172,89,.45); color: inherit; padding: 0 1px; }
.note { border-left: 3px solid var(--brass); padding: 8px 14px; background: var(--paper-2); font-size: var(--fs-small); line-height: 1.75; }
.note.warn { border-left-color: var(--rust); }
.note .nt { display: block; font-size: 11px; letter-spacing: .2em; color: var(--rust-deep); margin-bottom: 2px; }
.m-table { border-collapse: collapse; width: 100%; font-size: var(--fs-small); line-height: 1.6; }
.m-table th, .m-table td { border: 1px solid var(--paper-line); padding: 6px 10px; text-align: left; vertical-align: top; }
.m-table thead th { font-weight: 600; background: var(--paper-2); font-family: var(--serif); }
.m-table tbody th { font-weight: 600; background: var(--paper-2); white-space: nowrap; }
.m-table.center td { text-align: center; }
.table-wrap { overflow-x: auto; }
.m-faq dt { font-weight: 600; margin-top: var(--sp-4); }
.m-faq dt::before { content: "問 "; color: var(--rust-deep); font-family: var(--serif); }
.m-faq dd { margin: 4px 0 0 1.5em; }
.m-gloss dt { font-weight: 600; margin-top: var(--sp-3); font-family: var(--serif); }
.m-gloss dd { margin: 2px 0 0 1.2em; font-size: var(--fs-small); }

/* 図（スクリーンショット・動画） */
figure.shot { margin: var(--sp-4) 0 0; }
figure.shot .frame { display: block; border: 1px solid var(--paper-line); background: var(--desk); border-radius: var(--radius-m); overflow: hidden; }
figure.shot img, figure.shot video { display: block; width: 100%; height: auto; }
figure.shot a.frame { cursor: zoom-in; }
figure.shot figcaption { font-size: var(--fs-caption); color: var(--ink-soft); line-height: 1.6; margin-top: 6px; }
figure.shot figcaption .fno { color: var(--rust-deep); letter-spacing: .1em; margin-right: 6px; }
figure.shot .missing { display: none; border: 1px dashed var(--paper-line); padding: var(--sp-4); color: var(--ink-soft); font-size: var(--fs-caption); background: var(--paper-2); }
figure.shot.is-missing .frame { display: none; }
figure.shot.is-missing .missing { display: block; }
.figgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-top: var(--sp-4); }
.figgrid figure.shot { margin: 0; }
dialog.lightbox { border: none; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
dialog.lightbox::backdrop { background: rgba(0,0,0,.82); }
dialog.lightbox img { display: block; max-width: 96vw; max-height: 88vh; width: auto; height: auto; border: 1px solid var(--desk-line); }
dialog.lightbox figcaption { color: var(--paper); font-size: var(--fs-caption); padding: 8px 4px; display: flex; justify-content: space-between; gap: var(--sp-3); }
dialog.lightbox button { appearance: none; background: none; border: 1px solid var(--desk-line); color: var(--paper); padding: 4px 10px; cursor: pointer; border-radius: var(--radius-s); font: 12px var(--sans); min-height: 28px; }

/* 検索の絞り込み */
.hidden-by-find { display: none !important; }
.nohit { margin-top: var(--sp-6); color: var(--ink-soft); display: none; }
.nohit.show { display: block; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--desk); color: var(--paper); border: 1px solid var(--desk-line); padding: 8px 14px; font-size: var(--fs-caption); border-radius: var(--radius-m); opacity: 0; pointer-events: none; transition: opacity var(--dur-fast) var(--ease); z-index: 40; }
.toast.show { opacity: 1; }

.colophon { margin-top: var(--sp-8); padding-top: var(--sp-4); border-top: 2px solid var(--ink); font-size: var(--fs-caption); color: var(--ink-soft); display: grid; gap: 6px; }
.colophon a { color: var(--rust-deep); }

/* ---------- 目次の引き出し（狭い画面） ---------- */
.toc-toggle { display: none; position: fixed; right: 14px; bottom: 14px; z-index: 35; appearance: none; background: var(--desk); color: var(--paper); border: 1px solid var(--brass); padding: 0 16px; min-height: 44px; font: 14px var(--sans); border-radius: 22px; cursor: pointer; box-shadow: var(--shadow-paper); }
.side-close { display: none; }
@media (max-width: 960px) {
  .book { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(88vw, 340px); transform: translateX(-100%); visibility: hidden; transition: transform var(--dur-slow) var(--ease), visibility 0s linear var(--dur-slow); z-index: 45; background: var(--desk); box-shadow: var(--shadow-paper); }
  .side.is-open { transform: none; visibility: visible; transition: transform var(--dur-slow) var(--ease), visibility 0s; }
  .side-close { display: inline-block; appearance: none; background: none; border: 1px solid var(--desk-line); color: var(--paper); padding: 4px 10px; font: 12px var(--sans); cursor: pointer; border-radius: var(--radius-s); min-height: 32px; margin-bottom: var(--sp-3); }
  .toc-toggle { display: block; }
  .stage { padding: var(--sp-4) 0 100px; }
  .paper { padding: var(--sp-6) 26px var(--sp-7); border-left: none; border-right: none; max-width: none; }
  .paper::before { display: none; }
  .figgrid { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  :root { --fs-h1: 28px; --fs-h2: 20px; }
  .paper { padding: var(--sp-5) 18px var(--sp-7); }
  .m-table { font-size: 12.5px; }
  .m-table th, .m-table td { padding: 5px 7px; }
}

/* ---------- タッチ端末: 押す所を 44px に ---------- */
@media (pointer: coarse), (max-width: 960px) {
  .toc-ch > a { min-height: 44px; display: flex; align-items: center; }
  .toc-ch { grid-template-columns: 1fr 44px; }
  .toc-ch > button { width: 44px; height: 44px; }
  .toc-secs a { min-height: 44px; display: flex; align-items: center; }
  .toc-tools button, .side-close { min-height: 44px; padding: 4px 12px; }
  .side-foot a { display: flex; align-items: center; min-height: 44px; }
  .finder input { min-height: 44px; }
  .finder .clear { min-height: 44px; min-width: 44px; }
  .finder .meta label { min-height: 44px; }
  .sec h3 .anchor { min-width: 44px; min-height: 44px; }
  dialog.lightbox button { min-height: 44px; }
}

/* ---------- 印刷 ---------- */
@media print {
  body { background: #fff; color: #000; }
  body::before, .side, .finder, .toc-toggle, .toast, .sec h3 .anchor, figure.shot .missing { display: none !important; }
  .book { display: block; }
  .stage { padding: 0; }
  .paper { box-shadow: none; border: none; max-width: none; padding: 0; background: #fff; }
  .paper::before { display: none; }
  .chapter { break-before: page; }
  .chapter:first-child { break-before: auto; }
  .sec { break-inside: avoid; }
  .sec a { border-bottom: none; color: #000; }
  figure.shot .frame { border-color: #999; }
}
</style>
</head>

<a class="skip" href="#main" data-t="skip">本文へ</a>
<div class="book">
  <nav class="side" id="side" data-ta="aria-label:toc">

    if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && !e.metaKey && !e.ctrlKey) { e.preventDefault(); findEl.focus(); findEl.select(); }
  });

  /* 本文の中の当たりを塗る（節の中だけ。前回の塗りは外す） */
  let marked = [];
  function clearHighlights() { marked.forEach((m) => { const p = m.parentNode; if (!p) return; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); }); marked = []; }
  function highlightIn(secEl, ts) {
    clearHighlights(); if (!ts.length) return;
    const walker = document.createTreeWalker(secEl.querySelector(".sec-body"), NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.parentNode.closest("figcaption, kbd, code, mark") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    const re = new RegExp(ts.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
    nodes.forEach((n) => {
      const text = n.textContent; if (!re.test(norm(text))) return; re.lastIndex = 0;
      const frag = document.createDocumentFragment(); let last = 0; let m;
      const nt = norm(text); // NFKC 正規化で長さが変わりうるので、変わった場合は塗らない
      if (nt.length !== text.length) return;
      while ((m = re.exec(nt))) { frag.appendChild(document.createTextNode(text.slice(last, m.index))); const mk = document.createElement("mark"); mk.textContent = text.slice(m.index, m.index + m[0].length); frag.appendChild(mk); marked.push(mk); last = m.index + m[0].length; }
      frag.appendChild(document.createTextNode(text.slice(last))); n.parentNode.replaceChild(frag, n);
    });
  }

  /* ---- 図の拡大 ---- */
  const lb = $("#lightbox");
  bodyEl.addEventListener("click", (e) => {
    const a = e.target.closest("a.frame[data-lightbox]"); if (!a) return; e.preventDefault();
    $("#lightbox-img").src = a.getAttribute("href"); $("#lightbox-img").alt = a.querySelector("img").alt;
    $("#lightbox-cap").textContent = a.closest("figure").querySelector("figcaption").textContent;
    lb.showModal();
  });
  $("#lightbox-close").addEventListener("click", () => lb.close());
  lb.addEventListener("click", (e) => { if (e.target === lb) lb.close(); });
  bodyEl.querySelectorAll("figure.shot img, figure.shot video").forEach((m) => { m.addEventListener("error", () => m.closest("figure").classList.add("is-missing")); });

  /* ---- 目次の引き出し ---- */
  const side = $("#side"), toggle = $("#toc-toggle");
  function openSide() { side.classList.add("is-open"); toggle.setAttribute("aria-expanded", "true"); }
  function closeSide() { side.classList.remove("is-open"); toggle.setAttribute("aria-expanded", "false"); }
  toggle.addEventListener("click", () => (side.classList.contains("is-open") ? closeSide() : openSide()));
  $("#side-close").addEventListener("click", closeSide);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && side.classList.contains("is-open")) closeSide(); });

  /* ---- 起動 ---- */
  const first = tocEl.querySelector(":scope > li"); if (first) setOpen(first, true);
  const startId = decodeURIComponent(location.hash.slice(1));
  if (startId) requestAnimationFrame(() => go(startId, { noPush: true }));
  const p = new URLSearchParams(location.search).get("q"); if (p) { findEl.value = p; renderResults(p); }
});
</script>
</body>
</html>
