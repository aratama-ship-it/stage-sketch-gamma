<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミュージックシンク — 音源に合わせてシーンを組む</title>
<!-- 試作: 製品コードに触れない固定HTML。トークンは ../design/TOKEN_SHEET.md が正。
     確かめる操作: ①音源を再生しながらカウントをタップして全員の配置を一括記録（前の配置を引き継ぎ差分だけ直す）
                  ②配置の複製・左右入替・名前交換 -->
<style>
:root{
  --bg:#191512;--panel:#201b16;--raised:#282119;--floor:#2a221c;--line:#382f25;
  --text:#dcd4c4;--text-strong:#f0e7d6;--text-dim:#a9a397;
  --accent:#e6b85c;--accent-deep:#9c823f;--record:#df6433;--record-deep:#8f3e1e;--audience:#e6b85c;--playhead:#ef4b34;--move:#8fc47a;--move-deep:#5f8f4c;
  --raised-hover:#2f2720;--raised-active:#1d1814;--ink-on-accent:#191512;--ink-on-record:#191512;--canvas-void:#191512;--canvas-front-void:#191512;--canvas-front:#141110;
  --fs-count:34px;--fs-h:18px;--fs-body:15px;--fs-small:13px;--fs-mark:12px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--radius:3px;
  --duration-fast:120ms;--duration-seek:180ms;--ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme="sunny"]{
  --bg:#f6c84c;--panel:#fff1b8;--raised:#fff8d6;--floor:#4a3716;--line:#6d541b;
  --text:#352500;--text-strong:#211600;--text-dim:#644e16;
  --accent:#b83d0f;--accent-deep:#7d280a;--record:#e6641a;--record-deep:#b83d0f;--audience:#b83d0f;--playhead:#c22a1d;--move:#2f6f3e;--move-deep:#24572f;
  --raised-hover:#ffe18a;--raised-active:#f1bf4e;--ink-on-accent:#fff1b8;--ink-on-record:#211600;--canvas-void:#ffd75a;--canvas-front-void:#191512;--canvas-front:#251b0d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.6;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);min-height:44px;padding:0 var(--s3);cursor:pointer;transition:background var(--duration-fast) var(--ease)}
button:hover{background:var(--raised-hover)}
button:active{background:var(--raised-active)}
button[aria-pressed="true"]{background:var(--accent);color:var(--ink-on-accent);border-color:var(--accent)}
button.record{background:var(--record);color:var(--ink-on-record);border-color:var(--record);font-weight:700;min-width:140px}
button.record:active{background:var(--record-deep);color:var(--text-strong)}
button:disabled{opacity:.45;cursor:default}
.filebtn{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);min-height:44px;display:inline-flex;align-items:center;padding:0 var(--s3);cursor:pointer;white-space:nowrap}
.filebtn.need{background:var(--record);color:var(--ink-on-record);border-color:var(--record);font-weight:700}
#trackName.warn{color:var(--accent)}
button.sq{min-width:44px;padding:0}
input[type=number],input[type=text]{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);min-height:44px;padding:0 var(--s2);width:5.5em}
select{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);min-height:44px;padding:0 var(--s2);color:var(--text)}
input[type=text].wide{width:100%}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 136px 30px 96px auto;height:100%;height:100dvh}
.scenes{position:relative;background:var(--panel);border-top:1px solid var(--line);overflow:hidden}
.scenes canvas{width:100%;height:100%;display:block;touch-action:none}
.lane{position:relative;background:var(--panel);border-top:1px solid var(--line);overflow:hidden}
.lane canvas{width:100%;height:100%;display:block;touch-action:none}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);row-gap:var(--s1);padding:var(--s1) var(--s3);background:var(--panel);border-bottom:1px solid var(--line);min-height:56px}
.bar h1{font-size:var(--fs-h);font-weight:600;margin:0 var(--s3) 0 0;color:var(--text-strong)}
.themeToggle{width:44px;min-width:44px;padding:0;font-size:20px;line-height:1;white-space:nowrap}
.topVolume{display:flex;align-items:center;gap:var(--s1)}
.topVolume input[type=range]{width:90px;height:44px}
.bar .spacer{flex:1}
.modes{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.modes button{border:0;border-radius:0;min-width:64px}
.main{display:grid;grid-template-columns:var(--leftW,360px) 24px minmax(0,1fr) 24px var(--rightW,300px);min-height:0}
/* 欄の境目。つかんで横幅を変えられる。
   線は細く見せるが、つかむ幅は指でも届くように44px取る（タブレットでも動かせる） */
/* 溝は24px。つかむ幅は44px確保し、はみ出す10pxは両隣の余白（触るものが無い所）に重ねる */
.split{position:relative;z-index:3;justify-self:center;width:44px;background:var(--bg);cursor:col-resize;touch-action:none}
.split::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);background:var(--line)}
.split::after{content:"";position:absolute;top:50%;left:50%;width:4px;height:34px;transform:translate(-50%,-50%);border-radius:2px;background:var(--line)}
.split:hover::before,.split.active::before,.split:hover::after,.split.active::after{background:var(--accent)}
.split:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fpanel{background:var(--panel);border-right:1px solid var(--line);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-height:0;overflow:hidden}
.fpanel h2{font-size:var(--fs-small);font-weight:600;color:var(--text-dim);margin:0;letter-spacing:.04em}
.fpanelSection{display:flex;flex-direction:column;gap:var(--s1);flex:0 0 auto;padding-bottom:var(--s2);border-bottom:1px solid var(--line);font-size:var(--fs-mark);font-weight:600;color:var(--text-dim);letter-spacing:.04em}
.fpanelSection select{width:100%;min-height:44px;background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);padding:0 var(--s2);color:var(--text)}
#fpanelList{display:flex;flex-direction:column;gap:var(--s2);flex:1 1 auto;min-height:0;overflow:auto}
.fcard{flex:0 0 auto;display:flex;align-items:flex-start;gap:var(--s2);width:100%;text-align:left;padding:var(--s2);background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);min-height:44px;line-height:1.3}
.fcardMain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.fcardTrans{margin-top:var(--s1)}
.fcardTrans>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--s2);min-height:32px;font-size:var(--fs-mark);color:var(--move)}
.fcardTrans>summary::-webkit-details-marker{display:none}
.fcardTrans>summary::before{content:"";flex:0 0 auto;border:4px solid transparent;border-left-color:var(--move);transition:transform var(--duration-fast) var(--ease);transform-origin:30% 50%}
.fcardTrans[open]>summary::before{transform:rotate(90deg)}
.transBody{border-top:1px solid var(--line);padding-top:var(--s1)}
.transHead{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-mark);color:var(--text-dim);min-height:44px}
.transRow{display:flex;align-items:center;gap:var(--s1);min-height:44px}
.transRow .swat{flex:0 0 auto;width:12px;height:12px;border-radius:50%}
.transRow .who{flex:1 1 auto;min-width:0;font-size:var(--fs-mark);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transRow .lab{flex:0 0 auto;font-size:var(--fs-mark);color:var(--text-dim)}
.transRow input[type=number]{flex:0 0 auto;width:4.4em}
.fcardFoot{display:flex;align-items:center;gap:var(--s2);min-width:0}
.fcardFoot .fcardTitle{flex:1 1 auto;min-width:0}
.mvTag{color:var(--move);font-weight:600}
.fcardTitle{flex:1 1 auto;min-width:0;width:auto;padding:0 4px;font-size:var(--fs-mark);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);color:var(--accent)}
.fcardTitle::placeholder{color:var(--text-dim)}
.fcard[aria-current="true"]{border-color:var(--accent);background:var(--raised-hover)}
.fcardTop{display:flex;align-items:center;gap:var(--s2);justify-content:space-between;min-width:0}
.fcard{cursor:pointer}
.fcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fcard.dragging{opacity:.45}
.fcard.over{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.fcardPlan{flex:0 0 auto}
.fdup{flex:0 0 auto;min-width:44px;min-height:44px;padding:0 4px;font-size:var(--fs-mark);line-height:1.3;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);color:var(--text-dim);white-space:nowrap}
.fdup:hover{color:var(--text-strong);background:var(--raised)}
.fcardTop b{flex:0 0 auto;font-size:var(--fs-small);color:var(--text-strong);font-weight:700;line-height:1.35;white-space:nowrap}
.fcardSub{font-size:var(--fs-small);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcardPlan{position:relative;display:block;max-width:100%;background:var(--floor);border-bottom:1.5px solid var(--accent);border-radius:2px;align-self:flex-start}
.fcardPlan i{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%)}
.fcardTop,.fcardSub,.fcardNote,.fcardMeta,.fcardMove{flex:0 0 auto}
.fcardNote,.fcardMeta{font-size:var(--fs-mark);color:var(--text-dim);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcardMove{font-size:var(--fs-mark);color:var(--move);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpanelEnd b.moveKey{display:inline-block;width:10px;height:10px;background:var(--move);border-radius:2px;margin-right:4px;vertical-align:-1px}
.fpanelEnd{flex:0 0 auto;font-size:var(--fs-mark);color:var(--text-dim);line-height:1.5;border-top:1px solid var(--line);padding-top:var(--s2)}
.fpanelEnd button{width:100%;font-size:var(--fs-small);padding:0 var(--s2);margin-top:var(--s1)}
.stageWrap{position:relative;min-width:0;min-height:0}
.stageTools{position:absolute;z-index:2;left:var(--s3);bottom:var(--s3);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;max-width:calc(100% - var(--s5));padding:var(--s1);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.stageTools .modes{flex:0 0 auto}
.stageTools button{white-space:nowrap}
canvas{display:block;touch-action:none}
#front[hidden]{display:none!important}
.side{background:var(--panel);border-left:1px solid var(--line);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3);min-height:0;overflow:auto}
.side h2{font-size:var(--fs-small);font-weight:600;color:var(--text-dim);margin:0;letter-spacing:.04em}
.side>.sec{border-bottom:1px solid var(--line);padding-bottom:var(--s2);flex:0 0 auto}
.side>.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--s2);min-height:44px;font-size:var(--fs-small);font-weight:600;color:var(--text-dim);letter-spacing:.04em}
.side>.sec>summary::-webkit-details-marker{display:none}
.side>.sec>summary::before{content:"";flex:0 0 auto;border:5px solid transparent;border-left-color:var(--text-dim);margin-left:2px;transition:transform var(--duration-fast) var(--ease);transform-origin:30% 50%}
.side>.sec[open]>summary::before{transform:rotate(90deg)}
.side>.sec[open]>summary,.side>.sec>summary:hover{color:var(--text)}
.side>.sec>*+*{margin-top:var(--s2)}
.secSub{font-size:var(--fs-mark);color:var(--accent);font-weight:600;margin:var(--s3) 0 0}
.count{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.count .eight{font-size:var(--fs-body);color:var(--text);white-space:nowrap}
.count .n{font-size:var(--fs-count);line-height:1.1;color:var(--text-strong);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.count .sec{font-size:var(--fs-small);color:var(--text-dim);font-variant-numeric:tabular-nums}
.row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.small{font-size:var(--fs-small);color:var(--text-dim)}
#sceneHeadRow{min-height:44px;align-items:center;cursor:pointer}
#sceneHead{width:22px;height:22px;margin:0 8px 0 0}
.bpmbox{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s2) var(--s3)}
.bpmbox summary{cursor:pointer;min-height:44px;line-height:44px;font-size:var(--fs-small);color:var(--text);font-weight:600}
.bpmbox .row{margin-top:var(--s2)}
.tapbtn{min-width:200px}
.bpmval{font-size:var(--fs-h);color:var(--text-strong);font-variant-numeric:tabular-nums;min-width:4.5em}
.bpmbox .step{border-top:1px solid var(--line);padding:var(--s2) 0}
.bpmbox .stepno{display:inline-block;color:var(--accent);font-weight:700;margin-right:4px}
.bpmbox .sub summary,#setupBox>summary{min-height:44px;line-height:44px;font-size:var(--fs-small);color:var(--text-dim);cursor:pointer}
.quickRow{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s1)}
.quickRow input[type=color]{flex:0 0 auto;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--raised)}
.quickRow input[type=text]{flex:1 1 auto;width:auto;min-width:0}
.castItem{border:1px solid var(--line);border-radius:var(--radius);background:var(--raised);margin-bottom:var(--s2)}
.castItem>summary{list-style:none;display:flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s2);cursor:pointer}
.castItem>summary::-webkit-details-marker{display:none}
.castItem>summary::before{content:"";flex:0 0 auto;border:4px solid transparent;border-left-color:var(--text-dim);transition:transform var(--duration-fast) var(--ease);transform-origin:30% 50%}
.castItem[open]>summary::before{transform:rotate(90deg)}
.castSwatch{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1px solid rgba(240,231,214,.35)}
.castName{flex:1 1 auto;font-size:var(--fs-small);color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.castBody{padding:var(--s2);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s1)}
.castBody label{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-mark);color:var(--text-dim);min-height:44px}
.castBody label>span{flex:0 0 5.2em}
.castBody input[type=text],.castBody input[type=number],.castBody select{flex:1 1 auto;width:auto;min-width:0;color:var(--text)}
.castBody input[type=color]{flex:0 0 auto;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--raised)}
.castBody h3{font-size:var(--fs-mark);color:var(--accent);margin:var(--s2) 0 0;font-weight:600}
.castBody .castRow2{display:flex;gap:var(--s2)}
.castBody .castRow2>label{flex:1 1 0;min-width:0}
.castBody .castRow2>label>span{flex:0 0 auto}
.count .n.pulse{color:var(--accent);transform:scale(1.08)}
.count .n{transition:transform var(--duration-fast) var(--ease),color var(--duration-fast) var(--ease);display:inline-block;transform-origin:left bottom}
.count .n.pulse.head{color:#f0e7d6;text-shadow:0 0 12px rgba(230,184,92,.9)}
.band{position:relative;background:var(--panel);border-top:1px solid var(--line);overflow:hidden}
.band canvas{width:100%;height:100%}
.ctrl{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);row-gap:var(--s1);padding:var(--s1) var(--s3);background:var(--panel);border-top:1px solid var(--line);min-height:56px}
.ctrlTempo{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;padding-left:var(--s2);border-left:1px solid var(--line)}
.ctrlTempo label{white-space:nowrap}
.ctrlTempo input[type=number]{width:4.5em}
.ctrlTempo .bpmval{min-width:0;font-size:var(--fs-small)}
.note{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s2);min-height:44px}
.hint{font-size:var(--fs-small);color:var(--text-dim);line-height:1.5}
.fTitle{position:absolute;left:50%;top:var(--s2);transform:translateX(-50%);display:flex;align-items:baseline;gap:var(--s2);pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:2px var(--s3);max-width:64%;white-space:nowrap;overflow:hidden}
.fTitle:empty{display:none}
.fTitle b{font-size:var(--fs-h);color:var(--text-strong);font-weight:700}
.fTitle .sub{font-size:var(--fs-small);color:var(--accent);overflow:hidden;text-overflow:ellipsis}
.fTitle .st{font-size:var(--fs-small);color:var(--move)}
.live{position:absolute;left:var(--s3);top:var(--s2);font-size:var(--fs-small);color:var(--text-dim);pointer-events:none;background:var(--panel);padding:0 var(--s2);border-radius:var(--radius)}
.live:empty{display:none}
.phoneCount{display:none;position:absolute;right:var(--s3);top:var(--s2);align-items:baseline;gap:var(--s1);pointer-events:none;color:var(--text-strong);font-size:var(--fs-small);line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:2px var(--s2)}
.phoneCount b{font-size:28px;line-height:1.5;font-variant-numeric:tabular-nums}
.facePop{position:absolute;display:flex;align-items:center;gap:var(--s2);background:var(--pop,#e6b85c);border:2px solid rgba(25,21,18,.45);border-radius:6px;padding:var(--s2) var(--s3);z-index:5;box-shadow:0 4px 16px rgba(8,7,6,.55);color:var(--ink-on-accent)}
.facePop[hidden]{display:none}
.facePop::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);border:7px solid transparent;border-right-color:var(--pop,#e6b85c)}
.facePopName{font-size:var(--fs-small);font-weight:700;color:var(--ink-on-accent);max-width:5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facePopDeg{font-size:16px;font-weight:700;color:var(--ink-on-accent);font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center}
.facePop button{min-height:40px;min-width:40px;padding:0 var(--s2);font-size:15px;background:rgba(25,21,18,.14);border:1px solid rgba(25,21,18,.4);color:var(--ink-on-accent);border-radius:4px;font-weight:600}
.facePop button:hover{background:rgba(25,21,18,.26)}
.facePop button:active{background:rgba(25,21,18,.36)}
.modal{position:fixed;inset:0;background:rgba(8,7,6,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:var(--s4)}
.modal[hidden]{display:none}
.modalBox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s5);max-width:520px;max-height:84vh;overflow:auto}
.modalBox h2{font-size:var(--fs-h);margin:0 0 var(--s3);color:var(--text-strong)}
.modalBox p,.modalBox li{font-size:var(--fs-body);margin:0 0 var(--s2)}
.modalBox ol{margin:0 0 var(--s4);padding-left:1.3em}
#markOne.need{background:var(--record);color:var(--ink-on-record);border-color:var(--record);font-weight:700}
@media (max-width:719px){
  .app{grid-template-rows:auto minmax(0,1fr) 120px 28px 88px auto}
  .bar{padding:var(--s1) var(--s2)}
  .bar h1{font-size:15px;flex-basis:100%;margin:0}
  .bar .spacer{display:none}
  .ctrl{padding:var(--s1) var(--s2)}
  .ctrl .spacer{display:none}
  .main{grid-template-columns:1fr}
  .side,.fpanel,.split{display:none}
  .phoneCount{display:flex}
  :root{--fs-count:40px}
}
@media (prefers-reduced-motion:reduce){:root{--duration-seek:0ms;--duration-fast:0ms}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>ミュージックシンク</h1>
    <button id="themeToggle" class="themeToggle" aria-label="明るい黄色テーマに切り替え" aria-pressed="false" title="明るい黄色テーマに切り替え">☀</button>
    <div class="modes" role="group" aria-label="時間の目盛り">
      <button id="unitCount" aria-pressed="true">カウント</button>
      <button id="unitTime" aria-pressed="false">時間</button>
    </div>
    <select id="songPick" aria-label="曲を選ぶ" title="編集する曲を選ぶ"></select>
    <button id="songDel" title="いま開いている楽曲を消す">この楽曲を削除</button>
    <button type="button" class="filebtn" id="fileBtn" aria-describedby="trackName" title="いま開いている楽曲に音源だけを追加します。シーンは変わりません">音源を追加</button><input type="file" id="file" accept="audio/*,video/*" hidden><span class="small" id="trackName">音源なし</span>

    shMid[2] + (headJ[2] - shMid[2]) * ring.s,
