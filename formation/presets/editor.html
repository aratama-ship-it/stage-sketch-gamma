<!doctype html><html lang="ja" data-stage-skin="warm-black" data-gamma-preserve-skin><head>
<script src="../../stage-runtime.js?v=20261027-v0390"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フォーメーション｜舞台スケッチ ガンマ</title><link rel="stylesheet" href="../../gamma-ui-tokens.css?v=20261025-v0387"><link rel="stylesheet" href="editor.css?v=20261026-v0388"></head><body>
<main><header><h1>フォーメーション</h1><p id="context-label"></p><p id="fatal" role="alert" hidden></p></header>
<section id="picker"><div class="toolbar"><h2 id="count-label">1. 形を選ぶ</h2></div><p class="muted">上が舞台の奥、下が客席。形を押すと人物の入れ替え画面へ進みます。</p><div id="grid" class="grid"></div></section>

</main>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-head"><div><p class="meta">2. 人物を入れ替える</p><h2 id="editor-title"></h2></div><button id="cancel">形を選び直す</button></div>
<div id="facing-tools" class="toolbar facing-tools" data-no-i18n role="group" aria-labelledby="facing-heading"><span id="facing-heading"></span><div id="facing-modes"></div><button id="facing-reset"></button></div>
<p id="help" data-no-i18n></p>
<div class="toolbar edit-tools"><label for="scale">大きさ</label><button id="scale-less" aria-label="大きさを5%小さく">−</button><input id="scale" type="number" min="20" max="100" step="5" value="80" aria-label="大きさ（%）"><span>%</span><button id="scale-more" aria-label="大きさを5%大きく">＋</button><button id="undo" disabled>元に戻す</button><button id="redo" disabled>やり直す</button><button id="mirror" title="同じ奥行きの段ごとに、人物の左右の順序を逆にします">各段の左右を交換</button></div>
<p id="footprint" class="meta"></p><div class="edit-layout"><section aria-label="舞台上の人物"><div id="viewport" tabindex="0" aria-label="舞台。必要に応じて縦横にスクロールできます"><div id="board"></div></div><p id="scroll-hint" class="meta" hidden>人物を押しやすい大きさで表示しています。舞台の余白をスワイプ、またはスクロールして移動できます。</p></section><aside><div id="overview" aria-label="フォーメーションの全体図"></div><h3>配置リスト</h3><div class="roster-heading" data-no-i18n><span id="roster-person"></span><span id="roster-facing"></span></div><p class="meta">こちらも2人を順に押して交換できます。</p><div id="roster"></div></aside></div>
<div class="dialog-foot"><p id="status" role="status" aria-live="polite">入れ替える人物を選んでください。</p><button id="apply" class="primary">このシーンへ反映</button></div></dialog>
